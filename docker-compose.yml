
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_room
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MAPR_DATABASE_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s

  backend:
    image: ghcr.io/wangdada8208/multi-agent-project-room-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      MAPR_DATABASE_URL: postgresql+asyncpg://postgres:${MAPR_DATABASE_PASSWORD:-password}@postgres:5432/agent_room
      MAPR_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - repos:/data/repos
      - kb:/data/knowledge

  frontend:
    image: ghcr.io/wangdada8208/multi-agent-project-room-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  repos:
  kb:
