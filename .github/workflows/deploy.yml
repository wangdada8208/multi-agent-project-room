name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this reviewed revision to production"
        type: boolean
        required: true
        default: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/wangdada8208/multi-agent-project-room-backend
  FRONTEND_IMAGE: ghcr.io/wangdada8208/multi-agent-project-room-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_room_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 10); do
            pg_isready -h localhost -U postgres && break
            sleep 2
          done

      - name: Run migrations
        env:
          MAPR_DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/agent_room_test
          PYTHONPATH: backend
        run: |
          python3 -m alembic upgrade head

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Member checks
        working-directory: workers/xmtp-member
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Frontend checks
        working-directory: frontend
        env:
          VITE_XMTP_WORKER_ADDRESS: ${{ vars.VITE_XMTP_WORKER_ADDRESS }}
          VITE_XMTP_ENV: ${{ vars.VITE_XMTP_ENV }}
        run: |
          npm ci
          npm test
          node scripts/validate-release-config.mjs
          npm run build

      - name: Run tests
        env:
          MAPR_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/agent_room_test
          MAPR_DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/agent_room_test
          PYTHONPATH: backend
        run: |
          python3 -m pytest backend/tests/ tests/test_local_agent_adapter.py tests/test_deploy_script.py -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_XMTP_WORKER_ADDRESS=${{ vars.VITE_XMTP_WORKER_ADDRESS }}
            VITE_XMTP_ENV=${{ vars.VITE_XMTP_ENV }}
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build
    runs-on: [self-hosted, multi-agent]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy)

    steps:
      - uses: actions/checkout@v6

      - name: 部署到服务器
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          VITE_XMTP_WORKER_ADDRESS: ${{ vars.VITE_XMTP_WORKER_ADDRESS }}
          VITE_XMTP_ENV: ${{ vars.VITE_XMTP_ENV }}
        run: |
          set -euo pipefail
          id
          stat -c 'Docker socket: %a %U %G' /var/run/docker.sock
          if ! getent group docker >/dev/null; then
            if [ "$(id -u)" = 0 ]; then groupadd docker; else sudo -n groupadd docker; fi
          fi
          if [ "$(id -u)" != 0 ]; then sudo -n usermod -aG docker "$(id -un)"; fi
          if [ "$(stat -c '%a' /var/run/docker.sock)" = 666 ]; then
            if [ "$(id -u)" = 0 ]; then
              chgrp docker /var/run/docker.sock
              chmod 660 /var/run/docker.sock
            else
              sudo -n chgrp docker /var/run/docker.sock
              sudo -n chmod 660 /var/run/docker.sock
            fi
          fi
          target=/opt/multi-agent-project-room
          if [ "$(id -u)" != 0 ] && { [ ! -w "$target" ] || [ ! -r "$target/.env" ]; }; then
            sudo -n chown "$(id -un):$(id -gn)" "$target" "$target/.env" "$target/docker-compose.yml"
          fi
          if docker info >/dev/null 2>&1; then
            bash scripts/deploy.sh
          else
            sudo -n usermod -aG docker "$(id -un)"
            sg docker -c 'bash scripts/deploy.sh'
          fi
