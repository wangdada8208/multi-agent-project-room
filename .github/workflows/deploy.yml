name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this reviewed revision to production"
        type: boolean
        required: true
        default: false
      reuse_image_tag:
        description: "Optional previously built commit with identical backend/frontend sources"
        type: string
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/wangdada8208/multi-agent-project-room-backend
  FRONTEND_IMAGE: ghcr.io/wangdada8208/multi-agent-project-room-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Numeric hosts, not "localhost": several SSRF/interop suites patch
      # socket.getaddrinfo to answer for every hostname, which would hijack the
      # PostgreSQL lookup and time out the DB connection (60s TimeoutError). A
      # literal IP takes asyncio's _ipaddr_info fast path and never consults the
      # stub. Keep these numeric even after the stubs are scoped.
      MAPR_DATABASE_URL: postgresql+asyncpg://postgres:test_password@127.0.0.1:5432/agent_room_test
      MAPR_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test_password@127.0.0.1:5432/agent_room_test
      # Real PostgreSQL + real Redis are mandatory: several audit suites skip
      # when they are absent, and a silent skip must never look like a pass.
      MAPR_TESTING: "1"
      MAPR_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_room_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # The audit suites require a real Redis: without it the rate-limit and
      # Redis-isolation tests fail on "Error 111 connecting to localhost:6379",
      # and a missing Redis must never be allowed to look like a pass.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Wait for PostgreSQL and Redis
        run: |
          # Always pass -d so the readiness probe never falls back to the
          # runner's OS user as a PostgreSQL role ("FATAL: role root does not exist").
          for i in $(seq 1 10); do
            pg_isready -h localhost -p 5432 -U postgres -d agent_room_test && break
            sleep 2
          done
          pg_isready -h localhost -p 5432 -U postgres -d agent_room_test
          # redis-cli is not installed on the runner image; probe with Python instead.
          for i in $(seq 1 30); do
            if python3 - <<'PY'
          import socket, sys
          s = socket.socket(); s.settimeout(1)
          try:
              s.connect(("127.0.0.1", 6379)); s.sendall(b"PING\r\n")
              ok = s.recv(16).startswith(b"+PONG")
          except OSError:
              ok = False
          finally:
              s.close()
          sys.exit(0 if ok else 1)
          PY
            then echo "Redis is up"; break; fi
            sleep 2
          done
          python3 - <<'PY'
          import socket, sys
          s = socket.socket(); s.settimeout(2); s.connect(("127.0.0.1", 6379))
          s.sendall(b"PING\r\n"); print("redis:", s.recv(16)); s.close()
          PY

      - name: Run migrations
        env:
          PYTHONPATH: backend
        run: |
          python3 -m alembic upgrade head

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Member checks
        working-directory: workers/xmtp-member
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Frontend checks
        working-directory: frontend
        env:
          VITE_XMTP_WORKER_ADDRESS: ${{ vars.VITE_XMTP_WORKER_ADDRESS }}
          VITE_XMTP_ENV: ${{ vars.VITE_XMTP_ENV }}
        run: |
          npm ci
          npm test
          node scripts/validate-release-config.mjs
          npm run build

      - name: Prove real PostgreSQL and real Redis are wired (no silent skip)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "backend/tests"); sys.path.insert(0, "backend")
          import app.main  # noqa: register all models
          import conftest as C
          from app.auth import rate_limit
          assert C.engine.dialect.name == "postgresql", f"tests would run on {C.engine.dialect.name}, not PostgreSQL"
          client = rate_limit._get_redis_sync()
          assert client is not None, "Redis is unreachable: rate-limit tests would silently skip"
          assert client.ping() is True
          url = rate_limit._get_effective_redis_url()
          assert url.rstrip("/").endswith("/15"), f"tests must use the dedicated Redis DB, got {url}"
          print("OK: PostgreSQL dialect =", C.engine.dialect.name, "| Redis DB =", url)
          PY

      - name: Run tests
        env:
          PYTHONPATH: backend
        run: |
          python3 -m pytest backend/tests/ tests/test_local_agent_adapter.py tests/test_deploy_script.py -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.deploy_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: meta
        env:
          REUSE_IMAGE_TAG: ${{ inputs.reuse_image_tag }}
        run: |
          set -euo pipefail
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          deploy_tag=$GITHUB_SHA
          if [ -n "$REUSE_IMAGE_TAG" ]; then
            [[ "$REUSE_IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]]
            git cat-file -e "$REUSE_IMAGE_TAG^{commit}"
            git diff --exit-code "$REUSE_IMAGE_TAG" "$GITHUB_SHA" -- backend frontend alembic.ini
            deploy_tag=$REUSE_IMAGE_TAG
            echo "Reusing identical application sources from $deploy_tag"
          fi
          echo "deploy_tag=${deploy_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_XMTP_WORKER_ADDRESS=${{ vars.VITE_XMTP_WORKER_ADDRESS }}
            VITE_XMTP_ENV=${{ vars.VITE_XMTP_ENV }}
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Upload exact release configuration
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: |
            docker-compose.yml
            scripts/deploy.sh
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: [self-hosted, multi-agent]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.sha }}
          path: ${{ github.workspace }}/release

      - name: 部署到服务器
        working-directory: release
        env:
          MAPR_RELEASE_DIR: ${{ github.workspace }}/release
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          VITE_XMTP_WORKER_ADDRESS: ${{ vars.VITE_XMTP_WORKER_ADDRESS }}
          VITE_XMTP_ENV: ${{ vars.VITE_XMTP_ENV }}
        run: |
          set -euo pipefail
          id
          stat -c 'Docker socket: %a %U %G' /var/run/docker.sock
          if ! getent group docker >/dev/null; then
            if [ "$(id -u)" = 0 ]; then groupadd docker; else sudo -n groupadd docker; fi
          fi
          if [ "$(id -u)" != 0 ]; then sudo -n usermod -aG docker "$(id -un)"; fi
          if [ "$(stat -c '%a' /var/run/docker.sock)" = 666 ]; then
            if [ "$(id -u)" = 0 ]; then
              chgrp docker /var/run/docker.sock
              chmod 660 /var/run/docker.sock
            else
              sudo -n chgrp docker /var/run/docker.sock
              sudo -n chmod 660 /var/run/docker.sock
            fi
          fi
          target=/opt/multi-agent-project-room
          if [ "$(id -u)" != 0 ] && { [ ! -w "$target" ] || [ ! -r "$target/.env" ]; }; then
            sudo -n chown "$(id -un):$(id -gn)" "$target" "$target/.env" "$target/docker-compose.yml"
          fi
          if docker info >/dev/null 2>&1; then
            bash scripts/deploy.sh
          else
            sudo -n usermod -aG docker "$(id -un)"
            sg docker -c 'bash scripts/deploy.sh'
          fi
