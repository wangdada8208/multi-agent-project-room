name: Audit Round 4 CI

# Independent verification workflow for the audit round 4 integration branch.
#
# Safety: this workflow NEVER deploys and never touches production.
#   - It is triggered by workflow_dispatch and by pull_request, only.
#   - There is no `push` trigger, so it cannot fire a production deploy from
#     an accidental push (production deploys live in deploy.yml and run only on
#     `push` to `main` or an explicit workflow_dispatch with deploy=true).
#   - permissions are read-only.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: backend
  # Real PostgreSQL + real Redis are mandatory: several audit suites silently
  # skip when they are absent, and a silent skip must never look like a pass.
  MAPR_TESTING: "1"
  MAPR_TEST_REDIS_URL: redis://localhost:6379/15

jobs:
  safety-guard:
    name: Safety guard (no main push / no deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Assert this run cannot deploy
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "::error::This audit workflow must never run from a push to main."
            exit 1
          fi
          echo "OK: no production side effect from this workflow."

  backend:
    name: Backend (real PostgreSQL + real Redis + Alembic)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mapr_audit_round4_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MAPR_DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/mapr_audit_round4_test
      MAPR_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/mapr_audit_round4_test
      MAPR_ENVIRONMENT: development
      # Enables the gated PG17 suites instead of letting them skip.
      MAPR_SSE_QUOTA_PG_ROOT: /tmp/mapr-sse-quota-bin-round4
      MAPR_ISOLATED_PG_ROOT: /tmp/mapr-sse-quota-bin-round4
      # Room-sync migration gate requires the owned cluster on this exact port.
      MAPR_ISOLATED_PG_PORT: "5432"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Wait for PostgreSQL and Redis
        run: |
          # Always pass -d so the readiness probe never falls back to the
          # runner's OS user as a PostgreSQL role ("FATAL: role root does not exist").
          for i in $(seq 1 30); do pg_isready -h localhost -p 5432 -U postgres -d mapr_audit_round4_test && break; sleep 2; done
          pg_isready -h localhost -p 5432 -U postgres -d mapr_audit_round4_test
          for i in $(seq 1 30); do redis-cli -h localhost ping && break; sleep 2; done
          redis-cli -h localhost ping

      - name: Alembic single-head check
        run: |
          python -m alembic heads | tee /tmp/alembic-heads.txt
          test "$(grep -c '(head)' /tmp/alembic-heads.txt)" = "1"
          grep -q 'h80c20261015' /tmp/alembic-heads.txt

      - name: Alembic upgrade head (fresh database)
        run: python -m alembic upgrade head

      - name: Alembic downgrade + re-upgrade round trip
        run: |
          python -m alembic downgrade g70c20261012
          python -m alembic upgrade head
          python -m alembic current | grep 'h80c20261015'

      - name: Stage an isolated PostgreSQL 17 binary tree
        run: |
          # Several gate suites (SSE quota, distributed reliability, room-sync
          # migration) only run when an independently owned PG17 package tree
          # exists under /tmp. Building it here means those gates EXECUTE
          # instead of silently skipping.
          ROOT=/tmp/mapr-sse-quota-bin-round4
          mkdir -p "$ROOT/usr/lib" "$ROOT/usr/share"
          cp -a /usr/lib/postgresql/17 "$ROOT/usr/lib/postgresql/17"
          cp -a /usr/share/postgresql/17 "$ROOT/usr/share/postgresql/17"
          test -x "$ROOT/usr/lib/postgresql/17/bin/initdb"
          test -x "$ROOT/usr/lib/postgresql/17/bin/pg_dump"
          test -f "$ROOT/usr/share/postgresql/17/postgres.bki"
          echo "isolated PG17 tree ready at $ROOT"

      - name: Prove real PostgreSQL and real Redis are wired (no silent skip)
        run: |
          python - <<'PY'
          import asyncio, os, sys
          sys.path.insert(0, "backend/tests"); sys.path.insert(0, "backend")
          import app.main  # noqa: register all models
          import conftest as C
          from app.auth import rate_limit
          assert C.engine.dialect.name == "postgresql", f"tests would run on {C.engine.dialect.name}, not PostgreSQL"
          client = rate_limit._get_redis_sync()
          assert client is not None, "Redis is unreachable: rate-limit tests would silently skip"
          assert client.ping() is True
          url = rate_limit._get_effective_redis_url()
          assert url.rstrip("/").endswith("/15"), f"tests must use the dedicated Redis DB, got {url}"
          print("OK: PostgreSQL dialect =", C.engine.dialect.name, "| Redis DB =", url)
          PY

      - name: Full backend + integration test suite
        run: |
          set -o pipefail
          python -m pytest backend/tests tests -q -ra | tee /tmp/pytest-summary.txt

      - name: Report every skipped test (gates that did not execute)
        run: |
          echo "### Skipped tests in this run" >> "$GITHUB_STEP_SUMMARY"
          if grep -qE '^SKIPPED' /tmp/pytest-summary.txt; then
            echo "::warning::Some gated suites did not execute. Each reason is listed below." \
              >> "$GITHUB_STEP_SUMMARY"
            grep -E '^SKIPPED' /tmp/pytest-summary.txt | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No skipped tests: every gate executed for real." >> "$GITHUB_STEP_SUMMARY"
          fi
          tail -1 /tmp/pytest-summary.txt >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            workers/xmtp-member/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: XMTP member typecheck and tests
        working-directory: workers/xmtp-member
        run: |
          npm ci
          npm run typecheck
          npm test

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      # Full history is required: the whitespace gate compares against the
      # merge base with the PR base branch, which a shallow clone lacks.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: git diff --check on the merged range
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF"
            git merge-base "origin/$BASE_REF" HEAD >/dev/null 2>&1 || { echo "::error::no merge base with origin/$BASE_REF"; exit 1; }
            echo "Range: origin/$BASE_REF...HEAD"
            git diff --check "origin/$BASE_REF...HEAD"
          else
            echo "Range: HEAD~1...HEAD"
            git diff --check HEAD~1 HEAD
          fi
          echo "OK: no whitespace errors."

      - name: No committed secrets in the tracked tree
        run: |
          set -e
          # Tracked env files must only be examples/placeholders.
          BAD=$(git ls-files | grep -E '(^|/)\.env$|\.env\.(production|prod|local)$' || true)
          if [ -n "$BAD" ]; then echo "::error::Tracked env file(s): $BAD"; exit 1; fi
          # Real-looking credentials must never be committed.
          PATTERNS='ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
          if git grep -I -n -E "$PATTERNS" -- . ':!docs' ':!*.md' ':!backend/tests' ':!tests' ; then
            echo "::error::Possible secret committed"; exit 1
          fi
          echo "OK: no tracked secrets found."
