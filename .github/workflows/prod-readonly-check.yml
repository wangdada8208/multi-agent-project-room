name: Production Readonly Check

# 只读检查：在部署机上读生产库，不写、不改表、不部署。
#
# 安全边界：
#   - 只有 workflow_dispatch 手动触发，没有 push 触发，除手动点击外不可能自己跑起来。
#   - 只读：psql 事务设为 READ ONLY，任何写语句会被数据库拒绝。
#   - 不部署：这里不调用 scripts/deploy.sh，不重启任何容器。
#   - 不打印密码：从 .env 只取 MAPR_DATABASE_PASSWORD 用于 psql 登录，不回显。

on:
  workflow_dispatch:
    inputs:
      confirm_readonly:
        description: "确认这是只读检查（不会改任何数据）"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  guard:
    name: Safety guard
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run unless this is the readonly check
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::error::This workflow only runs on manual dispatch."
            exit 1
          fi
          if [ "${{ inputs.confirm_readonly }}" != "true" ]; then
            echo "::error::confirm_readonly was not set."
            exit 1
          fi
          echo "OK: readonly check on ${{ github.ref_name }}"

  readonly-duplicates:
    name: Duplicate account scan on production (readonly)
    needs: guard
    runs-on: [self-hosted, multi-agent]
    steps:
      - uses: actions/checkout@v4

      - name: Scan for duplicate accounts
        env:
          MAPR_RELEASE_DIR: /opt/multi-agent-project-room
        run: bash scripts/verify/prod_readonly_duplicates.sh
