name: Publish Download Assets

on:
  workflow_dispatch:
    inputs:
      source_base_url:
        description: "Temporary HTTP base URL containing the files"
        required: true
      target_slug:
        description: "Subdirectory under /downloads/"
        required: true
        default: "skills-20260629"

jobs:
  publish:
    runs-on: [self-hosted, multi-agent]
    timeout-minutes: 60

    steps:
      - name: Verify state already on server (no github needed)
        if: always()
        env:
          TARGET_SLUG: ${{ inputs.target_slug }}
          PACKAGE_NAME: xmtp-member-0.1.0.tar.gz
        run: |
          set -x
          sudo -n ls -la /var/www/hub-downloads/ "/var/www/hub-downloads/$TARGET_SLUG/" || true
          sudo -n sha256sum "/var/www/hub-downloads/$TARGET_SLUG/$PACKAGE_NAME" || true
          curl -sk -o /dev/null -w "local http  → %{http_code}\n" -H "Host: hub.wangdada8208.xyz" \
            "http://127.0.0.1/downloads/$TARGET_SLUG/$PACKAGE_NAME" || true
          curl -sk -o /dev/null -w "local https → %{http_code}\n" --resolve "hub.wangdada8208.xyz:443:127.0.0.1" \
            "https://hub.wangdada8208.xyz/downloads/$TARGET_SLUG/$PACKAGE_NAME" || true
          curl -sI "https://hub.wangdada8208.xyz/downloads/$TARGET_SLUG/$PACKAGE_NAME" | head -3 || true
          echo "── real nginx /downloads config ──"
          sudo -n nginx -T 2>/dev/null | grep -n -B3 -A8 "downloads" || true
          echo "── where skills package really lives ──"
          sudo -n find / -xdev -name "skill-classification-20260629.md" 2>/dev/null | head -5 || true

      - uses: actions/checkout@v6
        with:
          ref: ops/publish-helper-pkg

      - name: Download, verify, and expose files
        env:
          SOURCE_BASE_URL: ${{ inputs.source_base_url }}
          TARGET_SLUG: ${{ inputs.target_slug }}
          PACKAGE_NAME: xmtp-member-0.1.0.tar.gz
          PACKAGE_SHA256: f64c5e80efa97acaff099807772ca16f7e45fbb483df2b63b71701946917ca9b
          CLASSIFICATION_NAME: xmtp-member-0.1.0.tar.gz.sha256
          CLASSIFICATION_SHA256: 78ea6abdba333b9bc6effd4f1d9eed43fd4b74e9dfdf07ed4608342884faadc9
        run: |
          set -euo pipefail

          case "$TARGET_SLUG" in
            *[!A-Za-z0-9._-]*|"")
              echo "Invalid target slug: $TARGET_SLUG" >&2
              exit 2
              ;;
          esac

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo -n"
          fi

          BASE_URL="${SOURCE_BASE_URL%/}"
          ROOT="/var/www/hub-downloads"
          DEST="$ROOT/$TARGET_SLUG"
          TMP="$DEST.tmp"

          $SUDO rm -rf "$TMP"
          $SUDO mkdir -p "$TMP"
          $SUDO chown "$(id -u):$(id -g)" "$TMP"

          # 运维分支内自带发布包：runner 到 github release CDN 的直连不稳，
          # checkout(git 协议)可用，故从工作区复制而不是 curl 下载。
          cp "${GITHUB_WORKSPACE}/release-pkg/$CLASSIFICATION_NAME" "$TMP/$CLASSIFICATION_NAME"
          cp "${GITHUB_WORKSPACE}/release-pkg/$PACKAGE_NAME" "$TMP/$PACKAGE_NAME"

          printf "%s  %s\n" "$CLASSIFICATION_SHA256" "$TMP/$CLASSIFICATION_NAME" | sha256sum -c -
          printf "%s  %s\n" "$PACKAGE_SHA256" "$TMP/$PACKAGE_NAME" | sha256sum -c -

          cat > "$TMP/README.txt" <<EOF
          mapr-helper (xmtp-member) release package

          Package:
            $PACKAGE_NAME
            sha256 $PACKAGE_SHA256

          Checksum sidecar:
            $CLASSIFICATION_NAME
            sha256 $CLASSIFICATION_SHA256
          EOF

          $SUDO mkdir -p "$ROOT"
          $SUDO rm -rf "$DEST"
          $SUDO mv "$TMP" "$DEST"
          $SUDO find "$DEST" -type d -exec chmod 755 {} \;
          $SUDO find "$DEST" -type f -exec chmod 644 {} \;

          # nginx 的 /downloads/ location 由技能包首发时已写入（该机 python3 过旧，
          # 跑不了带 __future__ 的补丁脚本；本次发布复用现有 location，跳过补丁）。
          echo "Nginx downloads location already present (skipped patch)"
          if false; then
          $SUDO python3 - <<'PY'
          import re
          import shutil
          import subprocess
          from datetime import datetime
          from pathlib import Path

          marker = "location ^~ /downloads/"
          location = """
              location ^~ /downloads/ {
                  alias /var/www/hub-downloads/;
                  autoindex off;
                  add_header X-Content-Type-Options "nosniff" always;
              }
          """

          dump = subprocess.run(
              ["nginx", "-T"],
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          ).stdout

          current_file: Path | None = None
          candidates: set[Path] = set()
          for line in dump.splitlines():
              match = re.match(r"# configuration file ([^:]+):", line)
              if match:
                  current_file = Path(match.group(1))
                  continue
              if current_file and "server_name" in line and "hub.wangdada8208.xyz" in line:
                  candidates.add(current_file)

          if not candidates:
              raise SystemExit("Could not find nginx config for hub.wangdada8208.xyz")

          changed = False
          for path in sorted(candidates):
              text = path.read_text()
              if marker in text:
                  continue

              inserts: list[tuple[int, str]] = []
              for match in re.finditer(r"server\s*\{", text):
                  start = match.start()
                  depth = 0
                  end = None
                  for idx in range(match.end() - 1, len(text)):
                      char = text[idx]
                      if char == "{":
                          depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              end = idx
                              break
                  if end is None:
                      continue
                  block = text[start:end]
                  if "server_name" in block and "hub.wangdada8208.xyz" in block:
                      inserts.append((end, location))

              if not inserts:
                  continue

              stamp = datetime.utcnow().strftime("%Y%m%d%H%M%S")
              shutil.copy2(path, f"{path}.bak-downloads-{stamp}")
              for pos, snippet in sorted(inserts, reverse=True):
                  text = text[:pos] + snippet + text[pos:]
              path.write_text(text)
              changed = True
              print(f"Patched {path}")

          if not changed:
              print("Nginx downloads location already present")
          PY
          fi

          $SUDO nginx -t
          if command -v systemctl >/dev/null 2>&1; then
            $SUDO systemctl reload nginx
          else
            $SUDO nginx -s reload
          fi

          echo "── ls $ROOT ──"
          $SUDO ls -la "$ROOT" "$DEST" || true
          echo "── local nginx probe (bypass Cloudflare) ──"
          curl -sk -o /dev/null -w "http 127.0.0.1  → %{http_code}\n" -H "Host: hub.wangdada8208.xyz" \
            "http://127.0.0.1/downloads/$TARGET_SLUG/$PACKAGE_NAME" || true
          curl -sk -o /dev/null -w "https 127.0.0.1 → %{http_code}\n" --resolve "hub.wangdada8208.xyz:443:127.0.0.1" \
            "https://hub.wangdada8208.xyz/downloads/$TARGET_SLUG/$PACKAGE_NAME" || true
          curl --fail --head --location \
            "https://hub.wangdada8208.xyz/downloads/$TARGET_SLUG/$CLASSIFICATION_NAME"
          curl --fail --head --location \
            "https://hub.wangdada8208.xyz/downloads/$TARGET_SLUG/$PACKAGE_NAME"

      - name: Also publish package at /downloads root (install.sh default URL)
        if: always()
        env:
          PACKAGE_NAME: xmtp-member-0.1.0.tar.gz
          PACKAGE_SHA256: f64c5e80efa97acaff099807772ca16f7e45fbb483df2b63b71701946917ca9b
          ROOT_NAME: xmtp-member-latest.tar.gz
          TARGET_SLUG: ${{ inputs.target_slug }}
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
          ROOT="/var/www/hub-downloads"
          $SUDO install -m 644 "$ROOT/$TARGET_SLUG/$PACKAGE_NAME" "$ROOT/$ROOT_NAME"
          printf "%s  %s\n" "$PACKAGE_SHA256" "$ROOT/$ROOT_NAME" | sha256sum -c -
          curl --fail --head --location \
            "https://hub.wangdada8208.xyz/downloads/$ROOT_NAME"

# ── WP6 可选挂载点：xmtp-member 发布包 ─────────────────────────────
# install.sh 的默认发布包地址是
#   {hub_origin}/downloads/xmtp-member-latest.tar.gz
# 要正式发布本机助手时，先跑 scripts/pack-xmtp-member.sh 得到
# dist/xmtp-member-<version>.tar.gz，然后任选其一：
#   a) 直接把 tar.gz 放到生产机 /var/www/hub-downloads/xmtp-member-latest.tar.gz；
#   b) 复用本工作流：把产物挂到一个临时 HTTP 地址，workflow_dispatch 填
#      source_base_url=<该地址>、target_slug=mapr，并把下面这段注释掉的步骤
#      按需改写（当前工作流的 PACKAGE_NAME/SHA256 是为技能包硬编码的，
#      复用时需把 env 参数化，或照上面 a) 手动放文件更省事）。
# 示例（需先把 PACKAGE_NAME/PACKAGE_SHA256 参数化后再启用）：
#   - name: Publish xmtp-member package
#     env:
#       PACKAGE_NAME: xmtp-member-latest.tar.gz
#       PACKAGE_SHA256: <pack 脚本输出的 .sha256 内容>
#     run: |
#       curl --fail --location --output "$TMP/$PACKAGE_NAME" "$BASE_URL/$PACKAGE_NAME"
#       printf "%s  %s\n" "$PACKAGE_SHA256" "$TMP/$PACKAGE_NAME" | sha256sum -c -
