name: Publish Download Assets

on:
  push:
    branches: [main]
    paths:
      - "workers/xmtp-member/**"
      - "scripts/pack-xmtp-member.sh"
      - ".github/workflows/publish-downloads.yml"
  workflow_dispatch:
    inputs:
      source_base_url:
        description: "Optional HTTP(S) base URL containing a prebuilt release tarball (leave empty to build from repo)"
        required: false
        default: ""
        type: string
      tarball_name:
        description: "Tarball filename under source_base_url (ignored when building from repo)"
        required: false
        default: "xmtp-member-0.1.0.tar.gz"
        type: string
      expected_sha256:
        description: "Expected 64-char SHA-256 hex digest when downloading from source_base_url"
        required: false
        default: ""
        type: string
      latest_alias:
        description: "Stable alias filename exposed under /downloads/ (leave empty to skip)"
        required: false
        default: "xmtp-member-latest.tar.gz"
        type: string
      target_slug:
        description: "Optional subdirectory under /downloads/ (empty publishes directly under /downloads/)"
        required: false
        default: ""
        type: string

concurrency:
  group: publish-downloads
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tarball_name: ${{ steps.pack.outputs.tarball_name }}
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      - name: Check out source for local packaging
        if: ${{ github.event_name == 'push' || inputs.source_base_url == '' }}
        uses: actions/checkout@v6

      - name: Pack XMTP member release
        if: ${{ github.event_name == 'push' || inputs.source_base_url == '' }}
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/pack-xmtp-member.sh
          built_tarball="$(find dist -maxdepth 1 -type f -name 'xmtp-member-*.tar.gz' | sort | head -n 1)"
          if [ -z "$built_tarball" ] || [ ! -f "$built_tarball" ]; then
            echo "pack-xmtp-member.sh did not produce dist/xmtp-member-*.tar.gz" >&2
            exit 2
          fi
          tarball_name="$(basename "$built_tarball")"
          case "$tarball_name" in
            *[!A-Za-z0-9._-]*|""|"."|"..")
              echo "Invalid packed tarball name: $tarball_name" >&2
              exit 2
              ;;
          esac
          sha_file="dist/$tarball_name.sha256"
          if [ ! -f "$sha_file" ]; then
            echo "pack-xmtp-member.sh did not produce $sha_file" >&2
            exit 2
          fi
          sha256="$(awk 'NR == 1 { print tolower($1) }' "$sha_file")"
          if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid packed SHA256 in $sha_file: $sha256" >&2
            exit 2
          fi
          echo "tarball_name=$tarball_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Skip local packing for external source mode
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_base_url != '' }}
        run: echo "source_base_url is set; publish will download the external tarball directly."

      - name: Upload member tarball artifact
        if: ${{ github.event_name == 'push' || inputs.source_base_url == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: member-tarball-${{ github.sha }}
          path: |
            dist/xmtp-member-*.tar.gz
            dist/xmtp-member-*.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: [self-hosted, multi-agent]
    timeout-minutes: 60

    steps:
      - name: Download packed member tarball
        if: ${{ github.event_name == 'push' || inputs.source_base_url == '' }}
        uses: actions/download-artifact@v8
        with:
          name: member-tarball-${{ github.sha }}
          path: ${{ runner.temp }}/member-tarball

      - name: Resolve, verify SHA256, and expose release tarball
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BASE_URL: ${{ inputs.source_base_url }}
          INPUT_TARBALL_NAME: ${{ inputs.tarball_name }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          INPUT_LATEST_ALIAS: ${{ inputs.latest_alias }}
          TARGET_SLUG: ${{ inputs.target_slug }}
          PACK_ARTIFACT_DIR: ${{ runner.temp }}/member-tarball
          PACK_TARBALL_NAME: ${{ needs.pack.outputs.tarball_name }}
          PACK_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          set -euo pipefail

          validate_filename() {
            local label="$1"
            local val="$2"
            case "$val" in
              *[!A-Za-z0-9._-]*|""|"."|"..")
                echo "Invalid $label: $val" >&2
                exit 2
                ;;
            esac
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            LATEST_ALIAS="$INPUT_LATEST_ALIAS"
          else
            LATEST_ALIAS="xmtp-member-latest.tar.gz"
          fi

          if [ -n "$LATEST_ALIAS" ]; then
            validate_filename "latest_alias" "$LATEST_ALIAS"
          fi
          if [ -n "$TARGET_SLUG" ]; then
            validate_filename "target_slug" "$TARGET_SLUG"
          fi

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo -n"
          fi

          if [ -d "/www/migrated/hub-downloads" ]; then
            ROOT="/www/migrated/hub-downloads"
          else
            ROOT="/var/www/hub-downloads"
          fi
          echo "Using downloads root: $ROOT"

          if [ -n "$TARGET_SLUG" ]; then
            DEST_DIR="$ROOT/$TARGET_SLUG"
            PUBLIC_PREFIX="https://hub.wangdada8208.xyz/downloads/$TARGET_SLUG"
          else
            DEST_DIR="$ROOT"
            PUBLIC_PREFIX="https://hub.wangdada8208.xyz/downloads"
          fi

          STAGE="$(mktemp -d "${TMPDIR:-/tmp}/mapr-publish.XXXXXX")"
          trap 'rm -rf "$STAGE"' EXIT

          if [ -n "$SOURCE_BASE_URL" ]; then
            TARBALL_NAME="$INPUT_TARBALL_NAME"
            validate_filename "tarball_name" "$TARBALL_NAME"

            SHA_NORM="$(printf '%s' "$EXPECTED_SHA256" | tr 'A-F' 'a-f')"
            if [[ ! "$SHA_NORM" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid expected_sha256 (must be 64 hex chars): $EXPECTED_SHA256" >&2
              exit 2
            fi

            BASE_URL="${SOURCE_BASE_URL%/}"
            curl --fail --location --retry 5 --retry-delay 5 \
              --output "$STAGE/$TARBALL_NAME" \
              "$BASE_URL/$TARBALL_NAME"

            printf "%s  %s\n" "$SHA_NORM" "$STAGE/$TARBALL_NAME" | sha256sum -c -
          else
            TARBALL_NAME="$PACK_TARBALL_NAME"
            validate_filename "tarball_name" "$TARBALL_NAME"

            SHA_NORM="$(printf '%s' "$PACK_SHA256" | tr 'A-F' 'a-f')"
            if [[ ! "$SHA_NORM" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid pack job SHA256 output: $PACK_SHA256" >&2
              exit 2
            fi

            if [ ! -d "$PACK_ARTIFACT_DIR" ]; then
              echo "Packed artifact directory is missing: $PACK_ARTIFACT_DIR" >&2
              exit 2
            fi
            TARBALL_PATH="$(find "$PACK_ARTIFACT_DIR" -type f -name "$TARBALL_NAME" -print -quit)"
            SHA_PATH="$(find "$PACK_ARTIFACT_DIR" -type f -name "$TARBALL_NAME.sha256" -print -quit)"
            if [ -z "$TARBALL_PATH" ] || [ -z "$SHA_PATH" ]; then
              echo "Packed artifact is missing $TARBALL_NAME or its .sha256 sidecar" >&2
              exit 2
            fi

            cp "$TARBALL_PATH" "$STAGE/$TARBALL_NAME"
            cp "$SHA_PATH" "$STAGE/$TARBALL_NAME.sha256"
            (cd "$STAGE" && sha256sum -c "$TARBALL_NAME.sha256" >/dev/null)
            COMPUTED_SHA="$(sha256sum "$STAGE/$TARBALL_NAME" | awk '{print tolower($1)}')"
            if [ "$COMPUTED_SHA" != "$SHA_NORM" ]; then
              echo "Artifact SHA256 mismatch: pack output $SHA_NORM, downloaded file $COMPUTED_SHA" >&2
              exit 2
            fi
          fi

          printf "%s  %s\n" "$SHA_NORM" "$TARBALL_NAME" > "$STAGE/$TARBALL_NAME.sha256"

          $SUDO mkdir -p "$DEST_DIR"
          $SUDO chmod 755 "$ROOT" "$DEST_DIR"

          $SUDO install -m 0644 "$STAGE/$TARBALL_NAME" "$DEST_DIR/.tmp.$TARBALL_NAME"
          $SUDO install -m 0644 "$STAGE/$TARBALL_NAME.sha256" "$DEST_DIR/.tmp.$TARBALL_NAME.sha256"
          $SUDO mv -f "$DEST_DIR/.tmp.$TARBALL_NAME" "$DEST_DIR/$TARBALL_NAME"
          $SUDO mv -f "$DEST_DIR/.tmp.$TARBALL_NAME.sha256" "$DEST_DIR/$TARBALL_NAME.sha256"

          if [ -n "$LATEST_ALIAS" ] && [ "$LATEST_ALIAS" != "$TARBALL_NAME" ]; then
            printf "%s  %s\n" "$SHA_NORM" "$LATEST_ALIAS" > "$STAGE/$LATEST_ALIAS.sha256"
            $SUDO install -m 0644 "$STAGE/$TARBALL_NAME" "$DEST_DIR/.tmp.$LATEST_ALIAS"
            $SUDO install -m 0644 "$STAGE/$LATEST_ALIAS.sha256" "$DEST_DIR/.tmp.$LATEST_ALIAS.sha256"
            $SUDO mv -f "$DEST_DIR/.tmp.$LATEST_ALIAS" "$DEST_DIR/$LATEST_ALIAS"
            $SUDO mv -f "$DEST_DIR/.tmp.$LATEST_ALIAS.sha256" "$DEST_DIR/$LATEST_ALIAS.sha256"
          fi

          # 自愈：早期版本在已含 /downloads/ 块（写法不同，判重没认出来）时重复
          # 插入，nginx -t 失败但文件已被写坏。恢复补丁前留下的 .bak-downloads-*
          # 备份，把配置改回补丁前状态；无备份可恢复才视为真故障。
          if ! $SUDO nginx -t >/dev/null 2>&1; then
            restored=0
            for orig in $($SUDO find /www/server/nginx/conf -type f -name '*.bak-downloads-*' -printf '%f\n' 2>/dev/null | sed 's/\.bak-downloads-.*//' | sort -u); do
              latest="$($SUDO find /www/server/nginx/conf -type f -name "$orig.bak-downloads-*" -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)"
              if [ -n "$latest" ]; then
                dir="$($SUDO dirname "$latest")"
                $SUDO cp "$latest" "$dir/$orig" && restored=1 && echo "Restored $dir/$orig from $latest"
              fi
            done
            if [ "$restored" -eq 1 ]; then
              $SUDO nginx -t || { echo "nginx -t still failing after restoring backups" >&2; exit 1; }
            else
              $SUDO nginx -t || { echo "nginx -t failing and no .bak-downloads-* backups found" >&2; exit 1; }
            fi
          fi

          # 判重要认出 /downloads/ 的任意写法（^~、普通前缀、带不带尾斜杠），
          # 不能只比对唯一一种文本形式。
          if $SUDO nginx -T 2>&1 | grep -qE 'location[[:space:]]+(=[[:space:]]+|\^~[[:space:]]+|~\*?[[:space:]]+)?/downloads/?[[:space:]]*\{'; then
            echo "Nginx /downloads/ location already configured; skipping patch"
          else
            $SUDO env DOWNLOADS_ROOT="$ROOT" python3 - <<'PY'
          import os
          import re
          import shutil
          import subprocess
          from datetime import datetime
          from pathlib import Path

          downloads_root = os.environ["DOWNLOADS_ROOT"].rstrip("/") + "/"
          has_location = re.compile(
              r"location\s+(=\s+|\^~\s+|~\*?\s+)?/downloads/?\s*\{"
          )
          location = (
              "\n    location ^~ /downloads/ {\n"
              "        alias " + downloads_root + ";\n"
              "        autoindex off;\n"
              "        add_header X-Content-Type-Options \"nosniff\" always;\n"
              "    }\n"
          )

          dump = subprocess.run(
              ["nginx", "-T"],
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              universal_newlines=True,
          ).stdout

          current_file = None
          candidates = set()
          for line in dump.splitlines():
              match = re.match(r"# configuration file ([^:]+):", line)
              if match:
                  current_file = Path(match.group(1))
                  continue
              if current_file and "server_name" in line and "hub.wangdada8208.xyz" in line:
                  candidates.add(current_file)

          if not candidates:
              raise SystemExit("Could not find nginx config for hub.wangdada8208.xyz")

          # 候选文件常互为 include 关系（如 funnel-router.conf 被 vhost include），
          # 给多个文件各插一块会在同一 server 内产生 duplicate location。
          # 只补丁第一个缺块的可落点文件。
          for path in sorted(candidates):
              text = path.read_text()
              if has_location.search(text):
                  continue

              inserts = []
              for match in re.finditer(r"server\s*\{", text):
                  start = match.start()
                  depth = 0
                  end = None
                  for idx in range(match.end() - 1, len(text)):
                      char = text[idx]
                      if char == "{":
                          depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              end = idx
                              break
                  if end is None:
                      continue
                  block = text[start:end]
                  if "server_name" in block and "hub.wangdada8208.xyz" in block:
                      inserts.append((end, location))

              if not inserts:
                  continue

              stamp = datetime.utcnow().strftime("%Y%m%d%H%M%S")
              backup = str(path) + ".bak-downloads-" + stamp
              shutil.copy2(str(path), backup)
              for pos, snippet in sorted(inserts, reverse=True):
                  text = text[:pos] + snippet + text[pos:]
              path.write_text(text)
              print("Patched {}".format(path))
              try:
                  subprocess.run(["nginx", "-t"], check=True)
              except subprocess.CalledProcessError:
                  shutil.copy2(backup, str(path))
                  raise
              break
          PY
            if command -v systemctl >/dev/null 2>&1; then
              $SUDO systemctl reload nginx
            else
              $SUDO nginx -s reload
            fi
          fi

          curl --fail --head --location "$PUBLIC_PREFIX/$TARBALL_NAME?v=$SHA_NORM"
          if [ -n "$LATEST_ALIAS" ]; then
            curl --fail --head --location "$PUBLIC_PREFIX/$LATEST_ALIAS?v=$SHA_NORM"
          fi
